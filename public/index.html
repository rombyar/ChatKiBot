<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Kopi Bot - Asisten UMKM Kopi</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css"/>
</head>
<body>

  <div class="page-bg">

    <div class="chat-card">

      <!-- Header -->
      <header class="chat-header">
        <div class="bot-avatar">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
               stroke-linecap="round" stroke-linejoin="round" width="22" height="22">
            <path d="M12 2a2 2 0 0 1 2 2v1h2a3 3 0 0 1 3 3v8a3 3 0 0 1-3 3H8a3 3 0 0 1-3-3V8a3 3 0 0 1 3-3h2V4a2 2 0 0 1 2-2z"/>
            <circle cx="9" cy="12" r="1" fill="currentColor" stroke="none"/>
            <circle cx="15" cy="12" r="1" fill="currentColor" stroke="none"/>
            <path d="M9 16s1 1 3 1 3-1 3-1"/>
          </svg>
        </div>
        <div class="header-info">
          <span class="header-name">Rina - CS Kedai Kopi ☕</span>
          <span class="header-sub">
            <span class="status-dot"></span>
            <span id="header-status">Siap membantu</span>
          </span>
        </div>
        <div class="header-badge">AI</div>
      </header>

      <!-- Messages -->
      <main id="chat-box" class="chat-messages"></main>

      <!-- Input -->
      <footer class="chat-footer">
        <form id="chat-form" class="input-row">
          <input
            type="text"
            id="user-input"
            placeholder="Tanyakan sesuatu…"
            autocomplete="off"
            maxlength="500"
          />
          <button type="submit" class="send-btn" aria-label="Kirim">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
                 stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"
                 width="18" height="18">
              <line x1="22" y1="2" x2="11" y2="13"/>
              <polygon points="22 2 15 22 11 13 2 9 22 2"/>
            </svg>
          </button>
        </form>
        <p class="footer-note">Kedai Kopi Nusantara · Didukung Gemini AI</p>
      </footer>

    </div>

  </div>

  <script src="js/script.js"></script>
</body>
</html>
